services:
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./web:/app
    command: sh -c "npm i && npm run dev"
    environment:
      - VITE_API_BASE=http://localhost:8080/api
    ports:
      - "5173:5173" # Vite dev
    depends_on:
      - php
    tty: true

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./php:/var/www/html
      - ./web/dist:/var/www/html/public
    ports:
      - "8080:80"
    depends_on:
      - php

  php:
    build: ./php
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      API_KEY: ${API_KEY}
      LLM_URL: http://ollama:11434/v1/chat/completions
      LLM_MODEL: ${LLM_MODEL}
    volumes:
      - ./php:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - dbdata:/var/lib/mysql
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    ports:
      - "3306:3306"

  adminer:
    image: adminer
    ports: ["8081:8080"]
    depends_on: [db]

  # 任意: ローカルLLM（オフライン化 & 低遅延）
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
      # セッション暗号用（適当な長文ランダム文字列に置換）
      PMA_ABSOLUTE_URI: http://localhost:8080/phpmyadmin/
    depends_on:
      - db
    ports:
      - "8082:80"   # 直接アクセス用（http://localhost:8082）
volumes:
  dbdata:
  ollama:
