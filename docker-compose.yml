services:
  # 開発用のViteサーバー（開発時のみ使用）
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./web:/app
    command: sh -c "npm i && npm run dev"
    environment:
      - VITE_API_BASE=http://localhost:8080/api
    ports:
      - "5173:5173"
    depends_on:
      - app
    tty: true
    profiles: ["dev"]  # 開発時のみ起動

  # 統合アプリケーションサーバー（Nginx + PHP）
  app:
    build: 
      context: .
      dockerfile: Dockerfile.app
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      API_KEY: ${API_KEY}
      LLM_URL: http://host.docker.internal:11434/v1/chat/completions
      LLM_MODEL: ${LLM_MODEL}
    ports:
      - "8080:80"
    depends_on:
      - db

  db:
    image: mariadb:11.3
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - dbdata:/var/lib/mysql
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    ports:
      - "3306:3306"

  # データベース管理ツール（必要に応じて起動）
  adminer:
    image: adminer
    ports: ["8081:8080"]
    depends_on: [db]
    profiles: ["tools"]  # 必要時のみ起動
volumes:
  dbdata:
  # ollama: # ホストPCのOllamaを使用するため不要
