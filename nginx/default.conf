server {
  listen 80;
  server_name _;
  root /var/www/html/public;

  location /api/ {
    alias /var/www/html/api/;
    index index.php;
    try_files $uri /api/index.php$is_args$args;

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $request_filename;
      fastcgi_pass php:9000;
    }
  }

  location / {
    try_files $uri /index.html;
  }
}